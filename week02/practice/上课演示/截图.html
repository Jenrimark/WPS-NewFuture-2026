<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>菜鸟教程(runoob.com)</title>
  </head>
  <body>
    <button id="btn">点我截图</button>
    <p>
      <a href="https://www.runoob.com/images/logo.png" download="logo.png">
        <img
          border="0"
          src="https://www.runoob.com/images/logo.png"
          alt="runoob.com"
        />
      </a>
      <script src="https://cdn.bootcdn.net/ajax/libs/html2canvas/1.4.1/html2canvas.js"></script>
      <script>
        const oBtn = document.querySelector("#btn");
        oBtn.addEventListener("click", function () {
          html2canvas(document.body, {
            useCORS: true,
          }).then(function (canvas) {
            const oA = document.createElement("a");
            oA.href = canvas.toDataURL(); // 把 canvas 转成 base64
            oA.download = "报告.png";
            oA.click();
          });
        });
      </script>
    </p>
  </body>
</html>
