services:
  db:
    image: mysql:8.0
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordapp
      MYSQL_USER: wordapp
      MYSQL_PASSWORD: wordapp_pass
      TZ: Asia/Shanghai
    volumes:
      - db_data:/var/lib/mysql
      - ./docs/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - appnet

  backend:
    build:
      context: ./backend
    environment:
      TZ: Asia/Shanghai
      # 生产环境中，建议通过 .env 或 CI 注入这些变量
      MYSQL_DSN: wordapp:wordapp_pass@tcp(db:3306)/wordapp?charset=utf8mb4&parseTime=true&loc=Local
      JWT_SECRET: change_me_in_prod
      # AI 配置（任选其一或都配）
      # DEEPSEEK_API_KEY: your_key
      # DEEPSEEK_BASE_URL: https://api.deepseek.com
      # DEEPSEEK_MODEL: deepseek-chat
      # QWEN_API_KEY: your_key
      # QWEN_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      # QWEN_MODEL: qwen-plus
    depends_on:
      - db
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
